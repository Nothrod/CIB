<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube en MP3 | Club Informatique de Bethoncourt</title>
  <link rel="stylesheet" href="/youtube-mp3/style.css?v=2">
  <script src="/youtube-mp3/page.js?v=2" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">Club Informatique <span>de Bethoncourt</span></a>
    <a href="/">Retour à l’accueil</a>
  </header>
  <main>
    <div class="hero">
      <h1>YouTube en <span>MP3</span></h1>
      <p>Collez le lien d’une vidéo YouTube pour en télécharger l’audio au format MP3.</p>
    </div>
    <form id="converter">
      <label for="video-url">Lien de la vidéo YouTube</label>
      <input id="video-url" name="url" type="url" maxlength="2048" required
        placeholder="https://www.youtube.com/watch?v=…"
        autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="help">
      <small id="help">Vidéos publiques et Shorts de 10 minutes maximum.</small>
      <button type="submit">Convertir en MP3</button>
      <div id="progress-panel" hidden>
        <progress id="progress" max="100" aria-label="Progression du traitement"></progress>
        <span id="progress-value" aria-hidden="true"></span>
      </div>
      <p id="status" role="status"></p>
      <a id="download" class="download" hidden>Télécharger le MP3</a>
    </form>
    <p class="usage">Utilisez cet outil pour les contenus dont le téléchargement est autorisé.</p>
  </main>
</body>
</html>
